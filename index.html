<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f5f7">
  <meta name="description" content="品目マスタをJSONで管理できる、端末内保存の買い物メモ">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>買い物メモ</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="wrap">
    <header class="app-header">
      <h1>🛒 買い物メモ</h1>
      <p class="header-sub">候補からでも、手入力でも、すばやく追加</p>
    </header>

    <section class="card add-card" aria-labelledby="addHeading">
      <div class="section-heading">
        <div>
          <p class="section-kicker">ADD ITEM</p>
          <h2 id="addHeading">買うものを追加</h2>
        </div>
      </div>

      <form id="addForm" class="add-row" autocomplete="off">
        <input
          id="itemInput"
          maxlength="80"
          autocomplete="off"
          inputmode="text"
          placeholder="例：オリーブ、牛乳、ティッシュ"
          aria-label="買うもの"
        >
        <button class="primary add-button" type="submit">追加</button>
      </form>

      <p id="suggestionHint" class="suggestion-hint">
        よく使う候補。入力すると一致する候補が先頭に移動します。
      </p>
      <div id="suggestions" class="suggestions" aria-label="品目候補">
        <p class="catalog-status">品目データを読み込み中…</p>
      </div>
    </section>

    <section class="card memo-card" aria-labelledby="memoHeading">
      <div class="head">
        <div>
          <p class="section-kicker">SHOPPING NOTE</p>
          <h2 id="memoHeading">買うもの</h2>
          <p class="sub">－ / ＋ で個数調整、✓ でその品目を完了</p>
        </div>
        <span id="count" class="badge">0品目</span>
      </div>

      <div class="notebook">
        <p id="empty" class="empty">いま買うものはありません。</p>
        <ul id="list" class="shopping-list"></ul>
      </div>
    </section>

    <section class="card backup-card">
      <h2>バックアップ</h2>
      <p class="sub">端末変更やブラウザデータ削除に備えて、必要なときだけ保存できます。</p>
      <div class="toolbar">
        <button id="exportBtn" class="secondary" type="button">JSONで保存</button>
        <button id="importBtn" class="secondary" type="button">JSONから復元</button>
        <button id="clearBtn" class="secondary danger-lite" type="button">全削除</button>
      </div>
      <input id="importInput" type="file" accept="application/json,.json">
      <p class="note">
        買い物データはブラウザの端末内ストレージに保存され、GitHubへ送信されません。
        items.json とアプリ本体のみGitHub Pagesから読み込みます。
      </p>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>

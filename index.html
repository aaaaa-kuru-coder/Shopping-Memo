<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f5f7">
  <meta name="description" content="品目マスタをJSONで管理できる、端末内保存の買い物メモ">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>買い物メモ</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="wrap">
    <h1>🛒 買い物メモ</h1>
    <section class="card">
      <label for="presetButton">よく買う物</label>
      <div class="preset-picker">
        <button id="presetButton" class="preset-button" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span id="presetButtonLabel" class="preset-button-label">選択してください</span><span class="chevron">▼</span>
        </button>
        <div id="presetMenu" class="preset-menu hidden" role="listbox" aria-label="よく買う物">
          <p class="catalog-status">品目データを読み込み中…</p>
        </div>
      </div>
      <button id="addPreset" class="primary add-preset-button" type="button">追加</button>
      <div id="quickItems" class="quick" aria-label="クイック追加"></div>
      <div class="divider"><span>または</span></div>
      <label for="manual">その他の買い物</label>
      <form id="manualForm" class="row"><input id="manual" maxlength="80" autocomplete="off" placeholder="例：オリーブオイル"><button class="primary" type="submit">追加</button></form>
    </section>
    <section class="card">
      <div class="head"><div><h2>買うもの</h2><p class="sub">買えたら ✓ で即削除</p></div><span id="count" class="badge">0件</span></div>
      <p id="empty" class="empty">いま買うものはありません。</p><ul id="list"></ul>
    </section>
    <section class="card">
      <h2>バックアップ</h2><p class="sub">端末変更やブラウザデータ削除に備えて、必要なときだけ保存できます。</p>
      <div class="toolbar"><button id="exportBtn" class="secondary" type="button">JSONで保存</button><button id="importBtn" class="secondary" type="button">JSONから復元</button><button id="clearBtn" class="secondary" type="button">全削除</button></div>
      <input id="importInput" type="file" accept="application/json,.json"><p class="note">このアプリは外部通信を行いません。入力した買い物データは、このブラウザの端末内ストレージだけに保存されます。</p>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>

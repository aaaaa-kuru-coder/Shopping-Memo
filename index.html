<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f5f7"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"><title>買い物メモ</title></head><body><main class="wrap"><header class="app-header"><div><h1>🛒 買い物メモ</h1><p>候補からでも、手入力でも、すばやく追加</p></div><button id="menuButton" class="menu-button" aria-label="メニュー"><span></span><span></span><span></span></button></header><div id="menuBackdrop" class="menu-backdrop hidden"></div><aside id="appMenu" class="app-menu hidden"><div class="menu-title">操作</div><button id="exportBtn" class="menu-item">⇩ <span><b>バックアップを保存</b><small>買い物リストをJSONに保存</small></span></button><button id="importBtn" class="menu-item">⇧ <span><b>バックアップから復元</b><small>JSONファイルを読み込む</small></span></button><input id="importInput" type="file" accept="application/json,.json"></aside><section class="card add-card"><p class="kicker">ADD ITEM</p><h2>買うものを追加</h2><form id="addForm" class="add-row"><input id="itemInput" maxlength="80" autocomplete="off" placeholder="例：オリーブ、牛乳、ティッシュ"><button class="primary">追加</button></form><p class="hint">よく使う候補。入力すると一致する候補が先頭に移動します。</p><div id="suggestions" class="suggestions"><p>品目データを読み込み中…</p></div></section><section class="card memo-card"><div class="head"><div><p class="kicker">SHOPPING NOTE</p><h2>買うもの</h2><p>－ / ＋ で個数調整、✓ で完了</p></div><span id="count" class="badge">0品目</span></div><p id="empty" class="empty">いま買うものはありません。</p><ul id="list" class="shopping-list"></ul></section></main><div id="toast" class="toast"></div><script src="./app.js"></script></body></html>
